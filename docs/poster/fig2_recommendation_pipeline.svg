<svg width="680" height="164" viewBox="0 0 680 164" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Recommendation engine's three-stage ranking pipeline</title>
<desc>Stage A retrieval by FashionCLIP search, Stage B rerank by color and style rules, Stage C two-tower neural blend for 20 percent of sessions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="164" fill="#ffffff"/>
<g><rect x="40" y="60" width="180" height="64" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="130" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4A1B0C">Stage A: retrieval</text>
<text x="130" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#712B13">FashionCLIP search</text></g>
<line x1="220" y1="92" x2="240" y2="92" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<g><rect x="240" y="60" width="180" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="330" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#26215C">Stage B: rerank</text>
<text x="330" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">Color + style rules</text></g>
<line x1="420" y1="92" x2="440" y2="92" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<g><rect x="440" y="60" width="180" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="530" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#04342C">Stage C: two-tower</text>
<text x="530" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#085041">20% of sessions</text></g>
</svg>
