<svg width="680" height="714" viewBox="0 0 680 714" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Customer journey through the AI smart mirror</title>
<desc>A six-step vertical flow: presence detection, conversation with Aria, body and face scan, recommendation grid, item selection, and virtual try-on.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="714" fill="#ffffff"/>
<g><rect x="180" y="40" width="320" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A">Presence detected</text>
<text x="340" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#444441">Camera senses a customer</text></g>
<line x1="340" y1="104" x2="340" y2="154" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<g><rect x="180" y="154" width="320" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#26215C">Conversation with Aria</text>
<text x="340" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">Voice, understands intent</text></g>
<line x1="340" y1="218" x2="340" y2="268" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<g><rect x="180" y="268" width="320" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#04342C">Body &amp; face scan</text>
<text x="340" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#085041">MediaPipe + DeepFace</text></g>
<line x1="340" y1="332" x2="340" y2="382" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<g><rect x="180" y="382" width="320" height="64" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4A1B0C">Recommendation grid</text>
<text x="340" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#712B13">FashionCLIP + ranking engine</text></g>
<line x1="340" y1="446" x2="340" y2="496" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<g><rect x="180" y="496" width="320" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="514" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#26215C">Customer picks an item</text>
<text x="340" y="536" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">Voice or touch</text></g>
<line x1="340" y1="560" x2="340" y2="610" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<g><rect x="180" y="610" width="320" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="628" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#04342C">Virtual try-on</text>
<text x="340" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#085041">Live overlay or photoreal</text></g>
</svg>
