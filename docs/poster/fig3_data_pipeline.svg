<svg width="680" height="412" viewBox="0 0 680 412" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Data preprocessing pipeline</title>
<desc>A camera frame is processed by MediaPipe landmarks, which feed four parallel analyses -- body shape, face shape, skin tone, and gender ensemble -- that converge into one scan profile.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="412" fill="#ffffff"/>

<rect x="240" y="40" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A">Camera frame</text>
<line x1="340" y1="84" x2="340" y2="134" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="200" y="134" width="280" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="161" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#04342C">MediaPipe landmarks</text>

<line x1="340" y1="178" x2="115" y2="234" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="178" x2="265" y2="234" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="178" x2="415" y2="234" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="178" x2="565" y2="234" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="50" y="234" width="130" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="115" y="261" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#04342C">Body shape</text>
<rect x="200" y="234" width="130" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="265" y="261" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#04342C">Face shape</text>
<rect x="350" y="234" width="130" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="415" y="261" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#04342C">Skin tone</text>
<rect x="500" y="234" width="130" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="565" y="261" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#04342C">Gender</text>

<line x1="115" y1="278" x2="340" y2="328" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="265" y1="278" x2="340" y2="328" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="415" y1="278" x2="340" y2="328" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="565" y1="278" x2="340" y2="328" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="220" y="328" width="240" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A">Scan profile</text>
</svg>
